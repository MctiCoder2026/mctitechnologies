{% extends "base.html" %}
{% block title %}Trainer Login | MCTI{% endblock %}
{% block content %}
<div style="max-width:430px;margin:45px auto;padding:25px;background:#fff;border:1px solid #ddd;border-radius:12px">
  <h1 style="margin-bottom:10px">Trainer Login</h1>
  <p style="margin-bottom:18px">Use your own trainer credentials. Staff account details are not needed.</p>
  {% if error %}<p style="color:#b91c1c;margin-bottom:12px">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="trainer-username">Trainer username</label>
    <input id="trainer-username" name="username" required autocomplete="username"
           style="display:block;width:100%;padding:12px;margin:7px 0 16px">
    <label for="trainer-password">Password</label>
    <input id="trainer-password" type="password" name="password" required autocomplete="current-password"
           style="display:block;width:100%;padding:12px;margin:7px 0 18px">
    <button type="submit" style="background:#ff7200;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer">Open Trainer Dashboard</button>
  </form>
</div>
{% endblock %}
