{% extends "base.html" %}

{% block content %}

<div style="
    min-height: calc(100vh - 80px);
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f5f5f5;
">
    <div style="
        width: 100%;
        max-width: 560px;
        padding: 34px;
        border-radius: 20px;
        background: #fff;
        border: 1px solid #e5e5e5;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,.08);
    ">
        <div style="
            color: #f36a21;
            font-weight: 800;
            letter-spacing: 1px;
        ">
            MCTI CAREER KIT
        </div>

        <h1 style="margin: 14px 0 10px;">
            Invalid Aptitude Test Link
        </h1>

        <p style="color: #666; line-height: 1.6;">
            This QR or aptitude link is invalid.
            Please contact MCTI and request a new career-test link.
        </p>

        <a
            href="{% url 'career_tools:home' %}"
            style="
                display: inline-block;
                margin-top: 14px;
                padding: 13px 19px;
                border-radius: 9px;
                background: #f36a21;
                color: #fff;
                font-weight: 800;
                text-decoration: none;
            "
        >
            Open MCTI Career Kit
        </a>
    </div>
</div>

{% endblock %}
