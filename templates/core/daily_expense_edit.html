<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Expense | MCTI</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #111827;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px 25px;
        }

        .brand {
            font-size: 23px;
            font-weight: 800;
        }

        .brand span {
            color: #f97316;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 17px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .form-control,
        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        .error {
            color: #dc2626;
            font-size: 12px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            padding: 11px 17px;
            border-radius: 7px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-orange {
            background: #f97316;
            color: white;
        }

        .btn-dark {
            background: #111827;
            color: white;
        }

        @media (max-width: 650px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header class="header">

        <div class="brand">
            <span>MCTI</span> Technologies
        </div>

    </header>

    <main class="container">

        <section class="card">

            <h1>Edit Daily Expense</h1>

            <div class="subtitle">
                {{ expense.get_branch_display }} ·
                Entry #{{ expense.id }}
            </div>

            <form
                method="post"
                enctype="multipart/form-data"
            >

                {% csrf_token %}

                <div class="form-grid">

                    {% for field in form %}

                        <div>

                            <label for="{{ field.id_for_label }}">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% for error in field.errors %}

                                <div class="error">
                                    {{ error }}
                                </div>

                            {% endfor %}

                        </div>

                    {% endfor %}

                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-orange"
                    >
                        Update Expense
                    </button>

                    <a
                        class="btn btn-dark"
                        href="{% url 'daily_expense_list' %}?branch={{ expense.branch }}&year={{ original_year }}&month={{ original_month }}"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
